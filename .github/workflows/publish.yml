name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # trusted publishing; no API token is stored anywhere
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Three places carry the version and all three ship: the package, the
      # skill's frontmatter, and the tag itself. A mismatch means someone
      # installs one version and reads another's documentation.
      - name: Versions agree with the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          SKILL=$(grep -m1 '^version: ' skills/chsum/SKILL.md | awk '{print $2}')
          echo "tag=$TAG pyproject=$PKG skill=$SKILL"
          [ "$TAG" = "$PKG" ]   || { echo "::error::pyproject.toml is $PKG, tag is $TAG"; exit 1; }
          [ "$TAG" = "$SKILL" ] || { echo "::error::SKILL.md is $SKILL, tag is $TAG"; exit 1; }

      # chsum is stdlib-only and shells out to claude-history, so there is no
      # meaningful unit suite. This checks the thing that actually breaks on a
      # bad release: that the CLI still starts and its commands are wired up.
      - name: Smoke test
        run: |
          python3 chsum.py --help > /dev/null
          for cmd in sessions last find digest context journal; do
            python3 chsum.py "$cmd" --help > /dev/null || { echo "::error::$cmd is broken"; exit 1; }
          done
          echo "CLI responds on every subcommand"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
