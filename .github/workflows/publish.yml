name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # trusted publishing; no API token is stored anywhere
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The package version and the tag both ship. A mismatch means someone
      # installs one version under the name of another.
      - name: Version agrees with the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$TAG pyproject=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::pyproject.toml is $PKG, tag is $TAG"; exit 1; }

      # The suite above covers the layers; this covers the wiring, which is the
      # thing that actually breaks on a bad release: that the CLI still starts
      # and every command it advertises is reachable.
      # The list comes off the parser's own usage line, so a command added or
      # removed in chsum.py needs no edit here; a hardcoded list drifts from
      # the code and fails the release on a command that no longer exists.
      - name: Smoke test
        run: |
          python3 chsum.py --help > /dev/null
          CMDS=$(python3 chsum.py --help 2>&1 | grep -o '{[a-z,]\+}' | head -1 | tr -d '{}' | tr ',' ' ')
          [ -n "$CMDS" ] || { echo "::error::no subcommands in the usage line"; exit 1; }
          for cmd in $CMDS; do
            python3 chsum.py "$cmd" --help > /dev/null || { echo "::error::$cmd is broken"; exit 1; }
          done
          echo "CLI responds on every subcommand: $CMDS"

      # Stdlib `unittest`, so the release needs no test dependency. Each git
      # test configures the repository it builds, so the suite runs against a
      # bare environment with no global git identity — verified with `env -i`.
      - name: Tests
        run: python3 -m unittest discover -s tests -t tests -v

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
