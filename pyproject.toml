[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chsum"
version = "3.0.0"
description = "Work logs and reload-ready context from coding-agent conversations. Deterministic: no model, nothing invented."
readme = "README.md"
requires-python = ">=3.10"
# SPDX identifier plus the file, not the file's text: the `file` form folds the
# whole licence into the `License:` metadata header, twenty lines of it.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "InDate" }]
keywords = ["claude", "claude-code", "transcripts", "context", "work-log"]

# Deliberately empty, and worth keeping that way: chsum is stdlib-only, which is
# what lets it be installed anywhere and run against any corpus without a venv
# dance. `claude-history` is a runtime dependency but not a Python one — it's a
# separate binary on PATH.
dependencies = []

[project.scripts]
chsum = "chsum:main"

[tool.hatch.build.targets.wheel]
only-include = ["chsum"]

# Root-anchored, so `README.md` names the one beside this file rather than
# every README in the tree. `tests` ships so an sdist can be checked the same
# way CI checks the checkout.
[tool.hatch.build.targets.sdist]
include = ["/chsum", "/chsum.py", "/tests", "/README.md", "/CONTRIBUTING.md",
           "/LICENSE", "/skills"]
# `.gitignore` ships whatever this says: hatchling adds it to every sdist as a
# support file, beside `PKG-INFO` and `pyproject.toml`.
